<html>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="../libs/MDB-Free_4.5.11/js/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"

        crossorigin=""></script>
    <script src="../libs/leaflet/leaflet.js"></script>
    <script src="../libs/fontawesome-free-5.3.1-web/js/fontawesome.min.js"></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/v0.50.0/mapbox-gl.js'></script>
    <script src="../js/Chart.min.js"></script>
    <script src="../js/leaflet-legend.js"></script>
</head>

<body>
    <div id="map" style="width:100%; height:660px;"></div>
    <div id="msg"></div>
    <div id="add_model" class="modal fade">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title"></h4>
                </div>
                <div class="modal-body">
                    <form method = "POST"  id="frm_add">
                        <input type="hidden" value="add" name="action" id="action">
                        <div class="form-group">
                            <label for="type" class="control-label">Type:</label>
                            <input type="text" class="form-control" id="type" name="type" />
                        </div>
                        <div class="form-group">
                            <label for="fname" class="control-label">Name:</label>
                            <input type="text" class="form-control" id="fname" name="fname" />
                        </div>
                        <div class="form-group">
                            <label for="severity" class="control-label">Severity:</label>
                            <input type="text" class="form-control" id="severity" name="severity" />
                        </div>
                        <div class="form-group">
                            <label for="description" class="control-label">Description:</label>
                            <textarea rows="3" class="form-control" id="description" name="description" ></textarea>
                        </div>
                        <div class="form-group">
                            <label for="geom" class="control-label">Geometry:</label>
                            <input type="text" class="form-control" id="geom" name="geom" value="" />
                        </div>
                        <div class="form-group float-right">
                            <button type="button" class="btn btn-outline-danger" data-dismiss="modal">Close</button>
                            <button type="submit" id="btn_add" class="btn btn-outline-success">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="../js/simulator.js"></script>

<script type="text/javascript">
    $(document).ready(function () {
        simulator.initSimulator();

    });
</script>

</html>
