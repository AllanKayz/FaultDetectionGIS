<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta http-equiv="refresh" content="180" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" type="text/css" media="screen" href="../css/header.css" />

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css" integrity="sha512-puBpdR0798OZvTTbP4A8Ix/l+A4dHDD0DGqYW6RQ+9jxkRFclaxxQb/SJAWZfWAkuyeQUytO7+7N4QKrDh+drA=="
        crossorigin="" />
    <link rel="stylesheet" type="text/css" media="screen" href="../libs/leaflet/leaflet.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="../libs/MDB-Free_4.5.11/js/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="../libs/MDB-Free_4.5.11/js/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>
    <script src="../libs/bootstrap-4.1.3/dist/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js" integrity="sha512-nMMmRyTVoLYqjP9hrbed9S+FzjZHW5gY1TWCHA5ckwXZBadntCNs8kEqAWdrb9O7rxbCaA4lKTIWjDXZxflOcA=="
        crossorigin=""></script>
    <script src="../libs/leaflet/leaflet.js"></script>

</head>

<body>
    <header class="header-two-bars">
        <div class="header-first-bar">
            <div class="header-limiter">
                <h1><a href="#">Power<span>Utility</span></a></h1>
                <nav>
                    <a href="#">Messages <span class="badge badge-light">9</span></a>
                    <a href="#">Reports</a>
                </nav>
                <a href="faultmap.html" class="logout-button">Logout</a>
            </div>
        </div>

        <div class="header-second-bar">
            <div class="header-limiter">
                <nav class="nav justify-content-end nav-pills" id="pills-tab" role="tablist">
                    <a class="nav-link" id="pills-home-tab" data-toggle="pill" href="#pills-home" role="tab"
                        aria-controls="pills-home" aria-selected="true"><img src="../img/mapicon.png" width='20px'
                            height='20px'> Faults Allocated
                    </a>
                    <a class="nav-link" id="pills-profile-tab" data-toggle="pill" href="#pills-profile" role="tab"
                        aria-controls="pills-profile" aria-selected="false"><i class="fa fa-users"></i> Crew Members</a>
                    <a class="nav-link" id="pills-contact-tab" data-toggle="pill" href="#pills-contact" role="tab"
                        aria-controls="pills-contact" aria-selected="false"><i class="fa fa-wrench"></i> Suggested
                        Equipment
                    </a>
                    <a class="nav-link" id="pills-contact-tab" data-toggle="pill" href="#pills-contact" role="tab"
                        aria-controls="pills-contact" aria-selected="false"><i class="fa fa-print"></i> Print
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <section>
        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
                <div id="foreman">
                    <div id="map"> </div>
                </div>
            </div>
            <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
                <section style="padding: 20px; margin: 1% 5%;">
                    <table class="table table-striped">
                        <thead class="thead-dark">
                            <tr>
                                <th scope="col">First Name</th>
                                <th scope="col">Surname</th>
                                <th scope="col">Rank</th>
                                <th scope="col">Expertise</th>
                            </tr>
                        </thead>
                        <tbody id="crewMembers"></tbody>
                    </table>
                </section>
            </div>
            <div class="tab-pane fade" id="pills-contact" role="tabpanel" aria-labelledby="pills-profile-tab">
                <section style="padding: 20px; margin: 1% 5%;">
                    <table class="table table-striped">
                        <thead class="thead-dark">
                            <tr>
                                <th scope="col">Type</th>
                                <th scope="col">Name</th>
                                <th scope="col">Condition</th>
                            </tr>
                        </thead>
                        <tbody id="Equipment"></tbody>
                    </table>
                </section>
            </div>
        </div>

    </section>
    <footer>
    </footer>
</body>

<script src="../js/artisan.js"></script>

<script type="text/javascript">
    $(document).ready(function () {

        artisan.initCrew();
        artisan.initEquipment();
        artisan.initAddLayers();
    });
</script>

</html>
